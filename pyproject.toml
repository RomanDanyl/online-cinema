[tool.poetry]
name = "online-cinema"
version = "0.1.0"
description = "Online Cinema Backend"
readme = "README.md"
authors = ["RomanDanyl <162486585+RomanDanyl@users.noreply.github.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13"
fastapi = ">=0.122.0,<0.123.0"
uvicorn = { extras = ["standard"], version = ">=0.38.0,<0.39.0" }
sqlalchemy = ">=2.0.44,<3.0.0"
psycopg2-binary = ">=2.9.11,<3.0.0"
alembic = ">=1.17.2,<2.0.0"
passlib = { extras = ["bcrypt"], version = ">=1.7.4,<2.0.0" }
python-jose = { extras = ["cryptography"], version = ">=3.5.0,<4.0.0" }
email-validator = ">=2.3.0,<3.0.0"
pydantic-settings = ">=2.12.0,<3.0.0"
redis = ">=7.1.0,<8.0.0"
celery = ">=5.5.3,<6.0.0"
httpx = ">=0.28.1,<0.29.0"
aiosmtplib = ">=5.0.0,<6.0.0"
aioboto3 = ">=15.5.0,<16.0.0"
python-multipart = ">=0.0.20,<0.0.21"
pillow = ">=12.0.0,<13.0.0"
jinja2 = ">=3.1.6,<4.0.0"
aiosqlite = ">=0.21.0,<0.22.0"
asyncpg = ">=0.31.0,<0.32.0"
bcrypt = "<4.0.0"
stripe = ">=12.0.0,<13.0.0"

[tool.poetry.group.dev.dependencies]
black = ">=25.11.0,<26.0.0"
flake8 = ">=7.3.0,<8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py313"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "migrations",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "migrations",
]
